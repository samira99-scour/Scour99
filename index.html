<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeu de Questions</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.game{
  background:white;
  padding:20px;
  border-radius:14px;
  width:90%;
  max-width:400px;
  text-align:center;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

h3{
  font-size:20px;
}

button{
  display:block;
  width:100%;
  margin:10px 0;
  padding:14px;
  border:none;
  border-radius:10px;
  background:#3498db;
  color:white;
  font-size:18px;
  cursor:pointer;
}

.correct{
  background:green !important;
}

.wrong{
  background:red !important;
}

#result{
  font-weight:bold;
  margin-top:10px;
}

@media (max-width:480px){
  h3{
    font-size:18px;
  }
  button{
    font-size:16px;
    padding:12px;
  }
}
</style>
</head>

<body>

<div class="game">
  <h3 id="question"></h3>

  <button onclick="checkAnswer(0)" id="a0"></button>
  <button onclick="checkAnswer(1)" id="a1"></button>
  <button onclick="checkAnswer(2)" id="a2"></button>

  <div id="result"></div>
</div>

<script>
const questions = [
  {
    question:"Complétez la phrase : Il ___ très gentil.",
    answers:["est","mange","court"],
    correct:0
  },
  {
    question:"« Être » est :",
    answers:["un verbe d'état","un verbe d'action","un nom"],
    correct:0
  }
];

let current = 0;
let score = 0;

function resetButtons(){
  for(let i=0;i<3;i++){
    document.getElementById("a"+i).classList.remove("correct","wrong");
  }
}

function loadQuestion(){
  document.getElementById("result").innerText="";
  resetButtons();

  const q = questions[current];
  document.getElementById("question").innerText = q.question;
  document.getElementById("a0").innerText = q.answers[0];
  document.getElementById("a1").innerText = q.answers[1];
  document.getElementById("a2").innerText = q.answers[2];
}

function checkAnswer(index){
  const q = questions[current];

  // لون الجواب الصحيح
  document.getElementById("a"+q.correct).classList.add("correct");

  if(index === q.correct){
    score++;
    document.getElementById("result").innerText="✅ Bonne réponse";
  }else{
    document.getElementById("a"+index).classList.add("wrong");
    document.getElementById("result").innerText="❌ Mauvaise réponse";
  }

  setTimeout(()=>{
    current++;
    if(current < questions.length){
      loadQuestion();
    }else{
      document.querySelector(".game").innerHTML =
        "<h2>Jeu terminé 🎉</h2><p>Ton score : "+score+"</p>";
    }
  },1500);
}

loadQuestion();
</script>

</body>
</html>
